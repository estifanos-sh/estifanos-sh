<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Accrete</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #12130f;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      #__bundler_loading {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #666;
        background: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
        z-index: 10000;
      }
      #__bundler_thumbnail {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #12130f;
        z-index: 9999;
      }
      #__bundler_thumbnail svg {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #__bundler_placeholder {
        color: #999;
        font-size: 14px;
      }
    </style>

      <style>
        #__bundler_loading {
          display: none;
        }
      </style>

    </noscript>

    <div id="__bundler_thumbnail">
      <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(600 400)" fill="#e7e2d6">
          <rect x="-150" y="-150" width="300" height="300"></rect>

    <div id="__bundler_loading">Unpacking...</div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")" : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
          const templateEl = document.querySelector('script[type="__bundler/template"]');
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " + uuid + " may not render",
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
              }
            }),
          );

          const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus("Rendering...");
          for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap)
              .split("</" + "script>")
              .join("<\\/" + "script>") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template = template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (window.Babel && typeof window.Babel.transformScriptTags === "function") {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

0-04B1, U+2116;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Martian Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"bf583853-4ea6-4a92-948a-0dda5ee4bae4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Martian Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"8b8e6fec-7a3d-4731-8a27-7f862699c309\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{ --bg:#12130f; --ink:#e7e2d6; --ink-2:#bdb9ad; --muted:#807c70; --faint:#56534a; --accent:#e7e2d6;\n    --f:\"Figtree\", system-ui, sans-serif; --m:\"Martian Mono\", monospace;}\n  *{box-sizing:border-box;}\n  html,body{margin:0;height:100%;}\n  html{ font-size:100%; }\n  body{ background:var(--bg); color:var(--ink); font-family:var(--f); -webkit-font-smoothing:antialiased; overflow-x:hidden;}\n  .spacer{ height:175vh; pointer-events:none; }\n  .stage{ position:fixed; inset:0; z-index:0; }\n  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y; cursor:crosshair; background:#0f100c;}\n  .veil{ position:fixed; inset:0; background:#0f100c; opacity:0; pointer-events:none; z-index:1; }\n  .lab{ position:fixed; left:52px; top:46px; font-family:var(--m); font-size:0.6875rem; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; pointer-events:none; z-index:4;}\n  .col{ position:fixed; left:52px; bottom:52px; width:360px; pointer-events:none; z-index:4; opacity:0; transform:translateY(18px); transition:opacity .4s ease, transform .4s ease;}\n  .desc{ font-size:1.0625rem; line-height:1.7; color:var(--ink-2); margin:0; max-width:46ch; pointer-events:auto;}\n  .desc a{ color:var(--ink); text-decoration:underline; text-decoration-color:var(--accent); text-underline-offset:3px; text-decoration-thickness:.5px;}\n  .links{ display:flex; gap:20px; margin-top:22px; font-family:var(--m); font-size:0.8125rem; pointer-events:auto;}\n  .links a{ color:var(--muted); text-decoration:none; position:relative; transition:color .25s;}\n  .links a::after{ content:\"\"; position:absolute; left:0; right:100%; bottom:-4px; height:1px; background:var(--accent); transition:right .35s cubic-bezier(.76,0,.24,1);}\n  .links a:hover{ color:var(--ink);} .links a:hover::after{ right:0;}\n\n  .time{ position:fixed; top:38px; left:50%; transform:translateX(-50%); width:min(560px,72vw); height:18px; pointer-events:auto; z-index:5; touch-action:none;}\n  .time .track{ position:absolute; left:0; right:0; top:8px; height:1.5px; background:rgba(231,226,214,.10); border-radius:2px;}\n  .time .fill{ position:absolute; left:0; top:8px; height:1.5px; background:rgba(231,226,214,.4); border-radius:2px;}\n  .time .handle{ position:absolute; top:0; left:100%; width:16px; height:16px; margin-left:-8px; cursor:ew-resize; color:var(--accent); display:block;}\n  .time .handle polygon{ fill:none; stroke:currentColor; stroke-width:1.7; }\n  .time.live .handle{ animation:starspin 16s linear infinite; transform-origin:50% 50%;}\n  @keyframes starspin{ to{ transform:rotate(360deg);} }\n  @media (prefers-reduced-motion: reduce){ .time.live .handle{ animation:none;} }\n\n  @media (max-width:720px){\n    .lab{ left:22px; top:26px; }\n    .col{ left:22px; right:22px; width:auto; bottom:96px; }\n    .desc{ font-size:1rem; max-width:none; }\n    .time{ top:30px; width:86vw; }\n  }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body>\n  <div class=\"stage\" id=\"stage\">\n    <canvas id=\"cv\"><\u002Fcanvas>\n  <\u002Fdiv>\n  <div class=\"veil\" id=\"veil\"><\u002Fdiv>\n  <div class=\"col\" id=\"col\">\n    <p class=\"desc\">From enterprise infrastructure to building on the ground, I focus on environments where software quality and judgment actually matter. I now lead technical direction <a href=\"https://trestle.inc\" target=\"_blank\" rel=\"noreferrer\">@Trestle<\u002Fa>, building a system of record designed around the authentic workflows of frontline staff. As AI collapses the cost of automation, I've shifted my focus to the new frontier: reducing cognitive load and designing software that remains durable over time.<\u002Fp>\n    <nav class=\"links\">\n      <a href=\"https://github.com/robelest\" target=\"_blank\" rel=\"noreferrer\">GitHub<\u002Fa>\n      <a href=\"https://twitter.com/robelestifanos_\" target=\"_blank\" rel=\"noreferrer\">Twitter<\u002Fa>\n      <a href=\"https://linkedin.com/in/robelest\" target=\"_blank\" rel=\"noreferrer\">LinkedIn<\u002Fa>\n      <a href=\"mailto:robel@trestle.inc\">Email<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n  <div class=\"spacer\" aria-hidden=\"true\"><\u002Fdiv>\n\n<script>\n  // Flat 2D field. Random churn that, when probabilities align, gathers into an 8-pointed seal,\n  // then erodes back. Height reads as brightness/size. Drag to paint, click to drop a cell.\n  const stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');\n  const colEl=document.getElementById('col'), veilEl=document.getElementById('veil');\n  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n  const HMAX=4, MAXCOLS=320, SH=13;\n  let S=18, ox=560, oy=330, W,H,dpr=1;\n  const cols=new Map();                       // \"gx,gy\" -> {ht, hc}\n  const k=(x,y)=>x+','+y;\n  const BASE=[130,170,162];\n  const T0=performance.now(); const nowSec=()=>(performance.now()-T0)/1000;\n\n  let live=true, viewT=0;\n  const snaps=[]; const SNAP_MS=340, SNAP_CAP=1000; let snapAcc=0;\n\n  function gridToScreen(gx,gy){ return { X:ox+gx*S, Y:oy+gy*S }; }\n  function screenToGrid(Xc,Yc){ return { gx:Math.round((Xc-ox)/S), gy:Math.round((Yc-oy)/S) }; }\n\n  function backdrop(){\n    // faint cell grid behind the field\n    const c0=screenToGrid(0,0), c1=screenToGrid(W,H);\n    ctx.strokeStyle='rgba(231,226,214,.04)'; ctx.lineWidth=1; ctx.beginPath();\n    for(let gx=c0.gx-1; gx<=c1.gx+1; gx++){ const X=ox+gx*S+0.5; ctx.moveTo(X,0); ctx.lineTo(X,H); }\n    for(let gy=c0.gy-1; gy<=c1.gy+1; gy++){ const Y=oy+gy*S+0.5; ctx.moveTo(0,Y); ctx.lineTo(W,Y); }\n    ctx.stroke();\n  }\n\n  function drawCell(gx,gy,hc){\n    const {X,Y}=gridToScreen(gx,gy);\n    const t=Math.min(1, hc/2);                 // height → intensity\n    const b=0.34+0.62*t;\n    const sz=S*(0.62+0.26*t);\n    ctx.fillStyle=`rgb(${Math.round(BASE[0]*b)},${Math.round(BASE[1]*b)},${Math.round(BASE[2]*b)})`;\n    const half=sz/2;\n    ctx.fillRect(X-half, Y-half, sz, sz);\n    // thin inner seam so adjacent cells read as discrete blocks\n    ctx.strokeStyle='rgba(18,19,15,.35)'; ctx.lineWidth=0.7;\n    ctx.strokeRect(X-half+0.35, Y-half+0.35, sz-0.7, sz-0.7);\n  }\n\n  function drawFrom(entries){\n    ctx.clearRect(0,0,W,H); backdrop();\n    for(const e of entries){ const hc=e[1]; if(hc<=0.04) continue; const p=e[0].split(','); drawCell(+p[0], +p[1], hc); }\n  }\n  function render(){\n    if(live){ const arr=[]; cols.forEach((v,key)=>arr.push([key,v.hc])); drawFrom(arr); }\n    else { const sn=snapAt(viewT); drawFrom(sn? sn.m : []); }\n  }\n  function snapAt(t){ if(!snaps.length) return null; let lo=0,hi=snaps.length-1,best=snaps[0];\n    while(lo<=hi){ const mid=(lo+hi)>>1; if(snaps[mid].t<=t){ best=snaps[mid]; lo=mid+1; } else hi=mid-1; } return best; }\n\n  // ── ambient life: random churn that, when probabilities align, gathers into an 8-pointed seal ──\n  const H_RATE=5;\n  let gAcc=0, dAcc=0, hAcc=0, coh=0;\n  const star=new Map();                          // latent seal: key -> 1\n  (function buildStar(){\n    const h=SH, d=h*Math.SQRT2, tw=0.9, td=1.5;  // two equal square OUTLINES (one rotated 45°) → thin hollow 8-point seal\n    const R=Math.ceil(d)+1;\n    for(let gx=-R;gx<=R;gx++) for(let gy=-R;gy<=R;gy++){\n      const mx=Math.max(Math.abs(gx),Math.abs(gy)), di=Math.abs(gx)+Math.abs(gy);\n      const onSquare = (mx<=h && mx>=h-tw);\n      const onDiamond = (di<=d && di>=d-td);\n      if(onSquare || onDiamond) star.set(k(gx,gy), 2); }\n  })();\n  const starKeys=[...star.keys()]; const STAR_H=2;\n  function coherence(t){ if(window.__forceCoh!=null) return window.__forceCoh;\n    const period=78, ph=(t%period)/period, cycle=Math.floor(t/period);\n    let p; const a=0.42, b=0.58, r=0.05;                          // brief, rare gathering window each cycle\n    if(ph<a||ph>b) p=0; else if(ph<a+r) p=(ph-a)/r; else if(ph>b-r) p=(b-ph)/r; else p=1;\n    const strength=0.85+0.15*Math.abs(Math.sin(cycle*1.7+0.5));   // most align fully, some only mostly\n    return p*strength; }\n\n  function seed(){ for(let s=0;s<5;s++){ const cxs=(Math.random()*30-15)|0, cys=(Math.random()*30-15)|0;\n    for(let i=0;i<3;i++){ const gx=cxs+((Math.random()*3-1)|0), gy=cys+((Math.random()*3-1)|0), key=k(gx,gy);\n      if(!cols.has(key)) cols.set(key,{ht:1+(Math.random()*2|0),hc:0}); } } }\n  function occN(gx,gy){ return cols.has(k(gx+1,gy))||cols.has(k(gx-1,gy))||cols.has(k(gx,gy+1))||cols.has(k(gx,gy-1)); }\n  function emptyNbrs(gx,gy){ const o=[]; if(!cols.has(k(gx+1,gy)))o.push([gx+1,gy]); if(!cols.has(k(gx-1,gy)))o.push([gx-1,gy]);\n    if(!cols.has(k(gx,gy+1)))o.push([gx,gy+1]); if(!cols.has(k(gx,gy-1)))o.push([gx,gy-1]);\n    if(Math.random()<0.22){ const d=[[1,1],[1,-1],[-1,1],[-1,-1]][Math.random()*4|0]; if(!cols.has(k(gx+d[0],gy+d[1])))o.push([gx+d[0],gy+d[1]]); }  // occasional diagonal → branching\n    return o; }\n  function spread(){\n    if(coh>0.12 && Math.random()<coh*1.25){     // the shape tries to gather itself — arcs creep along the outline and meet\n      for(let t=0;t<12;t++){ const sk=starKeys[Math.random()*starKeys.length|0]; if(cols.has(sk)) continue;\n        const p=sk.split(','), gx=+p[0], gy=+p[1]; if(occN(gx,gy)){ cols.set(sk,{ht:1,hc:0}); return; } }   // grow where it touches existing structure\n      if(Math.random()<0.3){ const sk=starKeys[Math.random()*starKeys.length|0]; if(!cols.has(sk)) cols.set(sk,{ht:1,hc:0}); }  // occasionally seed a fresh fragment\n      return; }\n    // ── bacterial colony: grow at the frontier of existing clusters; rare new spores ──\n    const keys=[...cols.keys()];\n    if(!keys.length || (Math.random()<0.04 && cols.size<MAXCOLS)){            // rare new spore elsewhere\n      const gx=(Math.random()*44-22)|0, gy=(Math.random()*44-22)|0; cols.set(k(gx,gy),{ht:1,hc:0}); return; }\n    if(cols.size>=MAXCOLS) return;\n    for(let t=0;t<6;t++){ const parts=keys[Math.random()*keys.length|0].split(','), gx=+parts[0], gy=+parts[1];   // find a colony edge and extend it\n      const nb=emptyNbrs(gx,gy); if(nb.length){ const c=nb[Math.random()*nb.length|0]; cols.set(k(c[0],c[1]),{ht:1,hc:0}); return; } } }\n  function del(){ const keys=[...cols.keys()]; if(!keys.length) return;\n    if(coh>0.12 && Math.random()<coh){ for(let t=0;t<16;t++){ const key=keys[Math.random()*keys.length|0]; if(!star.has(key)){ const v=cols.get(key); v.ht=Math.max(0,v.ht-1); return; } } return; }  // gradually prune off-star, never the star\n    // bacterial die-off: cells with more empty neighbours (exposed edges / starved) are likelier to recede\n    let key=keys[Math.random()*keys.length|0];\n    for(let t=0;t<3;t++){ const cand=keys[Math.random()*keys.length|0], p=cand.split(','); if(emptyNbrs(+p[0],+p[1]).length>=3){ key=cand; break; } }\n    const v=cols.get(key); v.ht=Math.max(0, v.ht-1); }\n  function heightEv(){ const keys=[...cols.keys()]; if(!keys.length) return; const key=keys[Math.random()*keys.length|0], v=cols.get(key);\n    if(coh>0.12 && Math.random()<coh){ if(star.has(key)){ if(v.ht<STAR_H) v.ht++; } else if(v.ht>0) v.ht--; return; }  // ease heights toward the star\n    if(Math.random()<0.55) v.ht=Math.min(3, v.ht+1); else v.ht=Math.max(0, v.ht-1); }  // low, flat churn\n  function ease(){ cols.forEach((v,key)=>{ v.hc+=(v.ht-v.hc)*0.08; if(v.ht===0 && v.hc<0.04) cols.delete(key); }); }\n\n  let last=performance.now();\n  function loop(now){ const dt=Math.min(80, now-last); last=now;\n    const n=cols.size; coh=coherence(nowSec());\n    gAcc+=dt/1000*(6 + 0.05*n + coh*24);             while(gAcc>=1){ spread(); gAcc--; }    // organic growth, surges on alignment\n    dAcc+=dt/1000*(0.0009*Math.pow(n,1.9) + coh*16); while(dAcc>=1){ del(); dAcc--; }       // erosion + gradual carving\n    hAcc+=dt/1000*(H_RATE + coh*22);                 while(hAcc>=1){ heightEv(); hAcc--; }  // eases heights toward the star\n    ease();\n    snapAcc+=dt; while(snapAcc>=SNAP_MS){ const m=[]; cols.forEach((v,key)=>{ if(v.hc>0.04) m.push([key,+v.hc.toFixed(2)]); });\n      snaps.push({t:nowSec(), m}); if(snaps.length>SNAP_CAP) snaps.shift(); snapAcc-=SNAP_MS; }\n    render();\n    if(!reduced) requestAnimationFrame(loop);\n  }\n\n  // ── one surface, all drawing: drag paints, click drops a cell ──\n  function fit(){ const r=stage.getBoundingClientRect(); dpr=Math.min(2,window.devicePixelRatio||1);\n    W=Math.max(2,Math.floor(r.width)); H=Math.max(2,Math.floor(r.height)); cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);\n    ox = W>720 ? W*0.62 : W*0.5; oy=H*0.5; S=Math.max(7, Math.min(W,H)*0.82/(2*SH*Math.SQRT2)); }   // seal sits right-of-center on desktop to balance the bio\n  function pick(clientX,clientY){ const r=cv.getBoundingClientRect(); return screenToGrid((clientX-r.left)/r.width*W,(clientY-r.top)/r.height*H); }\n\n  let down=false, canceled=false, isMouse=false, sx=0, sy=0, px=0, swiping=false, stroke=new Set();\n  function paintAt(clientX,clientY){ const {gx,gy}=pick(clientX,clientY); const key=k(gx,gy); if(stroke.has(key)) return; stroke.add(key); live=true;\n    const v=cols.get(key); if(v){ v.ht=Math.min(HMAX,Math.max(v.ht,Math.ceil(v.hc))+1); } else cols.set(key,{ht:1,hc:0}); }\n  cv.addEventListener('pointerdown',e=>{ down=true; canceled=false; swiping=false; isMouse=(e.pointerType==='mouse'); sx=e.clientX; sy=e.clientY; px=e.clientX;\n    if(isMouse){ stroke=new Set(); paintAt(e.clientX,e.clientY); cv.setPointerCapture?.(e.pointerId); } });\n  cv.addEventListener('pointermove',e=>{ if(!down) return;\n    if(isMouse){ paintAt(e.clientX,e.clientY); return; }\n    const dx=e.clientX-sx, dy=e.clientY-sy;\n    if(swiping || (Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)*1.2)){ swiping=true; canceled=true; scrubBy((e.clientX-px)*SCRUB_TOUCH); px=e.clientX; } });\n  cv.addEventListener('pointercancel',()=>{ canceled=true; down=false; });   // native scroll started\n  window.addEventListener('pointerup',e=>{ if(!down) return; down=false; swiping=false;\n    if(!isMouse && !canceled){ if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)<10){ stroke=new Set(); paintAt(e.clientX,e.clientY); } } });\n\n  // ── scroll reveals the bio; field dims a touch behind it ──\n  function onScroll(){ const p=Math.min(1,(window.scrollY||window.pageYOffset)/(window.innerHeight*0.5));\n    colEl.style.opacity=p; colEl.style.transform=`translateY(${((1-p)*18).toFixed(1)}px)`; colEl.style.pointerEvents=p>0.15?'auto':'none';\n    veilEl.style.opacity=(p*0.5).toFixed(3); }\n  window.addEventListener('scroll',onScroll,{passive:true}); onScroll();\n\n  // ── horizontal scroll scrubs through the field's history ──\n  const SCRUB_WHEEL=0.012, SCRUB_TOUCH=0.02;\n  function scrubBy(seconds){ const t0=snaps.length?snaps[0].t:0, ns=nowSec();\n    if(live){ live=false; viewT=ns; }\n    viewT+=seconds;\n    if(viewT>=ns){ live=true; viewT=ns; } else if(viewT<t0){ viewT=t0; }\n    render(); }\n  window.addEventListener('wheel',e=>{ const dx=e.deltaX || (e.shiftKey?e.deltaY:0);\n    if(Math.abs(dx)<=Math.abs(e.deltaY) && !e.shiftKey) return;   // vertical wheel → let the bio reveal scroll\n    e.preventDefault(); scrubBy(dx*SCRUB_WHEEL); },{passive:false});\n\n  fit(); seed();\n  if(reduced){ for(let i=0;i<120;i++){ spread(); heightEv(); } cols.forEach(v=>v.hc=v.ht); render(); }\n  else requestAnimationFrame(loop);\n  new ResizeObserver(()=>{ const r=stage.getBoundingClientRect(); if(Math.abs(r.width-W)>2||Math.abs(r.height-H)>2) fit(); }).observe(stage);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
