name: Production deployment

on:
  workflow_dispatch:
    inputs:
      convex_auth_ref:
        description: Exact Convex Auth commit or ref to include
        required: false
        type: string
      convex_embedded_ref:
        description: Exact Convex Embedded commit or ref to include
        required: false
        type: string
concurrency:
  group: estifanos-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sources:
    name: Resolve documentation sources
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
    steps:
      - name: Check out landing source
        uses: actions/checkout@v7

      - name: Resolve release matrix
        id: sources
        run: node scripts/docs.mjs matrix

  docs:
    name: Build ${{ matrix.id }} docs
    needs: sources
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sources.outputs.matrix) }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out landing release machinery
        uses: actions/checkout@v7

      - name: Check out ${{ matrix.id }} source
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: .projects/${{ matrix.id }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Build and validate ${{ matrix.id }} documentation
        run: >-
          node scripts/docs.mjs build
          "${{ matrix.id }}"
          ".projects/${{ matrix.id }}"

      - name: Upload immutable documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-${{ matrix.id }}
          path: .docs/docs-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Assemble and deploy
    needs: docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: production
      url: https://estifanos.sh/
    steps:
      - name: Check out landing source
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0
          cache: true
          run-install: |
            args: ['--frozen-lockfile']

      - name: Check landing source
        run: vp check

      - name: Download immutable documentation
        uses: actions/download-artifact@v8
        with:
          pattern: docs-*
          path: .docs

      - name: Build, validate, and deploy production artifact
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: vp run deploy:release

      - name: Record deployment provenance
        run: node scripts/docs.mjs summary
