name: Validate documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out product content
        uses: actions/checkout@v7
        with:
          path: .project
          persist-credentials: false

      - name: Check out shared documentation engine
        uses: actions/checkout@v7
        with:
          repository: estifanos-sh/estifanos-sh
          path: .engine
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.15.0

      - name: Install documentation engine
        working-directory: .engine
        run: vp install --frozen-lockfile

      - name: Build and validate documentation
        working-directory: .engine
        run: node scripts/docs.mjs build-source ../.project
